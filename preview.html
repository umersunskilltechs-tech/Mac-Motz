<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mac Motz — Preview</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .preview-note { max-width: 42rem; margin: 1rem 0 3rem; color: var(--color-fog); }
    .preview-reel { margin: 0 0 5rem; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: var(--space-5); }
    .preview-grid .plate { width: 100%; height: auto; aspect-ratio: 4 / 5; }
    .preview-grid .plate__img { display: block; }
  </style>
</head>
<body class="page-home">
  <header class="site-header">
    <a class="site-header__mark" href="preview.html">Mac Motz</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="preview.html">Preview</a><a href="portfolio.html">Portfolio</a><a href="about.html">About</a><a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="page-shell">
    <p class="eyebrow">Direct HTML preview</p>
    <h1>Mac Motz</h1>
    <p class="preview-note">Temporary online photography stand-ins. Double-click this file anytime to preview the gallery without starting a server.</p>
    <div id="gallery"></div>
  </main>
  <script>
    const collections = [
      ['01','Interstate',6,'rust'], ['02','Low Country',5,'moss'], ['03','Vacancy',7,'clay'],
      ['04','Kin',6,'rust'], ['05','Static',5,'dust'], ['06','Coastline',6,'slate']
    ];
    const gallery = document.getElementById('gallery');
    let frame = 1;
    collections.forEach(([number, title, count, tone]) => {
      const section = document.createElement('section');
      section.className = 'preview-reel';
      section.innerHTML = '<div class="reel__head"><div class="reel__heading"><span class="reel__number mono">'+number+'</span><h2 class="reel__title">'+title+'</h2></div><span class="reel__count">'+String(count).padStart(2,'0')+' PLATES</span></div><div class="preview-grid"></div>';
      const grid = section.querySelector('.preview-grid');
      for (let i = 1; i <= count; i++, frame++) {
        const id = title.toLowerCase().replace(/ /g,'-').slice(0,3)+'-'+String(i).padStart(2,'0');
        const figure = document.createElement('figure');
        figure.className = 'plate'; figure.dataset.tone = tone;
        figure.innerHTML = '<img class="plate__img" src="https://picsum.photos/seed/macmotz-'+id+'/900/1125" alt="'+title+' photograph '+i+'" loading="lazy"><p class="plate__frame">F'+String(frame).padStart(3,'0')+'</p>';
        grid.appendChild(figure);
      }
      gallery.appendChild(section);
    });
  </script>
</body>
</html>
